[project]
name = "internal-ax"
version = "0.1.0"
description = "Code-agent readiness tester: run Claude Code and Codex headlessly on Modal against a Langfuse dataset, trace every run back to Langfuse."
requires-python = ">=3.11"
dependencies = [
    # Orchestration / hosting
    "modal>=0.64",
    # Tracing + dataset runs (Langfuse v4 line is OpenTelemetry-native)
    "langfuse>=4.0,<5",
    # Webhook endpoint
    "fastapi>=0.110",
    "pydantic>=2.6",
    # LLM-as-judge scoring
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_ax"]
